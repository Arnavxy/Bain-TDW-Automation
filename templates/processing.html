{% extends "base.html" %}

{% block title %}Processing - {{ app_name }}{% endblock %}

{% block content %}<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-5 text-center">
                    <div class="processing-animation mb-4">
                        <i class="fas fa-cog fa-spin fa-3x text-bain"></i>
                    </div>
                    
                    <h4 class="mb-3">Generating Your Cuts</h4>
                    
                    <div class="progress mb-3">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-bain" 
                             role="progressbar" 
                             style="width: 100%"></div>
                    </div>
                    
                    <p class="text-muted" id="statusText">Processing... Please wait.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Auto-redirect to results after processing
    setTimeout(function() {
        window.location.href = "{{ url_for('results') }}";
    }, 2000);
</script>
{% endblock %}
