{% extends "base.html" %}

{% block title %}Select Sheet - {{ app_name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">
                        <i class="fas fa-table me-2"></i>Select Sheet
                    </h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Your Excel file contains multiple sheets. Please select the one with your roster data.</p>
                    
                    <form action="{{ url_for('select_sheet') }}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Available Sheets</label>
                            <select name="sheet" class="form-select form-select-lg" required>
                                <option value="" disabled selected>Choose a sheet...</option>
                                {% for sheet in sheets %}
                                <option value="{{ sheet }}">{{ sheet }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-bain btn-lg">
                                <i class="fas fa-arrow-right me-2"></i>Continue
                            </button>
                            <a href="{{ url_for('upload') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Back
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
